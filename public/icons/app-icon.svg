<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">Revolut coursework app icon</title>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#f8f8f8"/>
      <stop offset="1" stop-color="#eeeeee"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="rShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="28" dy="22" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg)" filter="url(#cardShadow)"/>
  <text
    x="512"
    y="706"
    fill="#111111"
    filter="url(#rShadow)"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="720"
    font-weight="900"
    letter-spacing="-72"
    text-anchor="middle"
  >R</text>
</svg>
